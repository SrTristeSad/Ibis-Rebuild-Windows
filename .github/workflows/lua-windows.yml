name: Windows Lua-only package and tests

on:
  push:
    branches:
      - 'migration/**'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/lua_builder/**'
      - 'tools/lua_tests/**'
      - 'build.ps1'
      - 'test.ps1'
      - '.github/workflows/lua-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download verified LÖVE 11.5 for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'love-11.5-win64.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          $expected = 'BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369'
          if ($hash -ne $expected) { throw "Checksum inesperado: $hash" }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP -Force
          $rt = Join-Path $env:RUNNER_TEMP 'love-11.5-win64'
          if (!(Test-Path (Join-Path $rt 'lovec.exe'))) { throw 'lovec.exe nao encontrado' }
          "LOVE_RUNTIME=$rt" >> $env:GITHUB_ENV
      - name: Run all ported LuaJIT regressions without C++ or Python
        shell: pwsh
        run: .\test.ps1 -Runtime "$env:LOVE_RUNTIME"
      - name: Build Windows executable using Lua packaging
        shell: pwsh
        run: .\build.ps1 -Runtime "$env:LOVE_RUNTIME"
      - name: Assert executable and runtime files
        shell: pwsh
        run: |
          $exe = 'dist/Android1412Rebuild.exe'
          $love = 'dist/Android1412Rebuild.love'
          if (!(Test-Path $exe) -or !(Test-Path $love)) { throw 'Arquivos de distribuicao ausentes' }
          if (!(Get-ChildItem 'dist' -Filter '*.dll')) { throw 'DLLs do LÖVE ausentes' }
          if (Test-Path 'dist/rebuild_core.dll') { throw 'DLL antiga indevidamente empacotada' }
          if ((Get-Item $exe).Length -le (Get-Item $love).Length) { throw 'Executavel LÖVE nao fundido' }
      - uses: actions/upload-artifact@v4
        with:
          name: IbisRebuild-Lua-Windows
          path: |
            dist/Android1412Rebuild.exe
            dist/Android1412Rebuild.love
            dist/*.dll
          if-no-files-found: error
          retention-days: 7

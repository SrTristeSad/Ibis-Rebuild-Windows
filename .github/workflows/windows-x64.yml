name: Windows Lua/LÖVE - Ibis-Lua integration

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-interface-and-engine:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout with pinned Ibis-Lua interface
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Python for deterministic staging
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble existing interface with Lua motor
        shell: pwsh
        run: |
          python tools/assemble_lua.py --check
          python tests/test_lua_integration.py

      - name: Fetch verified official LÖVE 11.5 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'love-11.5-win64.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($hash -ne 'BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369') {
            throw "LÖVE runtime checksum mismatch: $hash"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP -Force
          $rt = Join-Path $env:RUNNER_TEMP 'love-11.5-win64'
          if (!(Test-Path (Join-Path $rt 'lovec.exe'))) { throw 'lovec.exe missing' }
          "LOVE_RUNTIME=$rt" >> $env:GITHUB_ENV

      - name: Prepare Mesa software OpenGL only on CI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'mesa'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695') {
            throw 'Mesa checksum mismatch'
          }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x $archive "-o$destination" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $gl = Get-ChildItem $destination -Recurse -File -Filter opengl32.dll |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          if (!$gl) { throw 'Mesa x64 not found' }
          $src = $gl.DirectoryName
          Copy-Item (Join-Path $src 'opengl32.dll') $env:LOVE_RUNTIME -Force
          Copy-Item (Join-Path $src 'libgallium_wgl.dll') $env:LOVE_RUNTIME -Force

      - name: Run real Lua pixel-engine test through LÖVE
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          Copy-Item bridge/lua_engine.lua tests/lua_paint/lua_engine.lua -Force
          Copy-Item bridge/lua_bridge.lua tests/lua_paint/lua_bridge.lua -Force
          Copy-Item bridge/lua_selection.lua tests/lua_paint/lua_selection.lua -Force
          Copy-Item bridge/lua_history.lua tests/lua_paint/lua_history.lua -Force
          Copy-Item tests/lua_paint/main.lua tests/lua_syntax/paint_main.lua -Force
          Copy-Item bridge/lua_engine.lua tests/lua_syntax/lua_engine.lua -Force
          Copy-Item bridge/lua_bridge.lua tests/lua_syntax/lua_bridge.lua -Force
          Copy-Item bridge/lua_selection.lua tests/lua_syntax/lua_selection.lua -Force
          Copy-Item bridge/lua_history.lua tests/lua_syntax/lua_history.lua -Force
          $syntaxOut = Join-Path $env:RUNNER_TEMP 'lua-syntax-stdout.log'
          $syntaxErr = Join-Path $env:RUNNER_TEMP 'lua-syntax-stderr.log'
          $syntax = Start-Process -FilePath "$env:LOVE_RUNTIME/lovec.exe" `
            -ArgumentList @((Resolve-Path 'tests/lua_syntax').Path) -PassThru `
            -RedirectStandardOutput $syntaxOut -RedirectStandardError $syntaxErr
          $syntaxFinished = $syntax.WaitForExit(20000)
          if (!$syntaxFinished) { Stop-Process -Id $syntax.Id -Force -ErrorAction SilentlyContinue }
          if (Test-Path $syntaxOut) { Get-Content $syntaxOut }
          if (Test-Path $syntaxErr) { Get-Content $syntaxErr }
          if (!$syntaxFinished) { throw 'Lua syntax checker timeout (20 seconds)' }
          if ($syntax.ExitCode -ne 0) { throw "Lua syntax checker failed ($($syntax.ExitCode))" }
          $path = (Resolve-Path 'tests/lua_paint').Path
          $stdout = Join-Path $env:RUNNER_TEMP 'lua-paint-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'lua-paint-stderr.log'
          $process = Start-Process -FilePath "$env:LOVE_RUNTIME/lovec.exe" `
            -ArgumentList @($path) -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $finished = $process.WaitForExit(60000)
          if (!$finished) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if (!$finished) { throw 'Lua pixel engine test timeout (60 seconds)' }
          if ($process.ExitCode -ne 0) { throw "Lua engine test failed ($($process.ExitCode))" }

      - name: Validate original UI navigation through LÖVE
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
          PAINT_LUA_E2E: '1'
        run: |
          & "$env:LOVE_RUNTIME/lovec.exe" (Resolve-Path 'build/lua-app').Path
          if ($LASTEXITCODE -ne 0) { throw "Ibis-Lua UI E2E failed ($LASTEXITCODE)" }

      - name: Package Windows runtime and Lua app (no project C++ DLL)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path (Get-Location) 'build/lua-app'
          $loveFile = Join-Path (Get-Location) 'build/IbisLua-Windows.love'
          $temporaryZip = Join-Path (Get-Location) 'build/IbisLua-Windows.zip'
          Compress-Archive -Path "$stage/*" -DestinationPath $temporaryZip -Force
          Move-Item $temporaryZip $loveFile -Force
          $portable = Join-Path (Get-Location) 'build/portable'
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Get-ChildItem $env:LOVE_RUNTIME -File |
            Where-Object { $_.Name -notin @('opengl32.dll', 'libgallium_wgl.dll') } |
            Copy-Item -Destination $portable
          Copy-Item $loveFile (Join-Path $portable 'IbisLua-Windows.love')
          Set-Content -Path (Join-Path $portable 'Iniciar-IbisLua.cmd') -Value '@echo off' -Encoding Ascii
          Add-Content -Path (Join-Path $portable 'Iniciar-IbisLua.cmd') -Value 'cd /d "%~dp0"' -Encoding Ascii
          Add-Content -Path (Join-Path $portable 'Iniciar-IbisLua.cmd') -Value 'start "" "%~dp0love.exe" "%~dp0IbisLua-Windows.love"' -Encoding Ascii
          if (Test-Path (Join-Path $portable 'rebuild_core.dll')) { throw 'C++ DLL forbidden' }
          Compress-Archive -Path "$portable/*" -DestinationPath 'build/IbisLua-Windows-portable.zip' -Force

      - name: Publish portable test build
        uses: actions/upload-artifact@v4
        with:
          name: IbisLua-Windows-Lua-Portable
          path: build/IbisLua-Windows-portable.zip
          if-no-files-found: error
          retention-days: 7

name: Windows x64 verification

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-and-interface:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout independently implemented sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch verified LÖVE 11.5 x64 runtime for CI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'love-11.5-win64.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $expected = 'BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369'
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "LÖVE 11.5 artifact checksum mismatch. Got $actual"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP -Force
          $rt = Join-Path $env:RUNNER_TEMP 'love-11.5-win64'
          if (!(Test-Path (Join-Path $rt 'love.exe'))) { throw 'Missing love.exe in verified archive' }
          "LOVE_RUNTIME=$rt" >> $env:GITHUB_ENV

      - name: Diagnose Windows startup paths
        shell: pwsh
        run: python tools/windows_preflight.py --runtime "$env:LOVE_RUNTIME" --output build/preflight.json

      - name: Build independent C++ DLL and offline LÖVE executable
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          python tools/build.py all --compiler "$compiler" --runtime "$env:LOVE_RUNTIME"

      - name: Test LuaJIT and storage contracts
        shell: pwsh
        run: python tools/test.py --suite lua --runtime "$env:LOVE_RUNTIME"

      - name: Test compiled C++ ABI and raster primitives
        shell: pwsh
        run: python tools/test.py --suite native

      # GitHub-hosted Windows normally exposes OpenGL 1.1 (GDI Generic).
      # Load a pinned Mesa llvmpipe only in this ephemeral CI VM; it is NOT
      # shipped in the app and does not replace the application renderer.
      - name: Prepare pinned software OpenGL for CI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.4-release-msvc.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.4'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
          $expected = '351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695'
          if ($hash -ne $expected) { throw "Unexpected Mesa SHA256: $hash" }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x $archive "-o$destination" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa archive extraction failed' }
          $gl = Get-ChildItem $destination -Recurse -File -Filter opengl32.dll |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          if (!$gl) { throw 'Mesa x64 opengl32.dll missing from pinned archive' }
          $src = $gl.DirectoryName
          foreach ($target in @("$env:LOVE_RUNTIME", (Join-Path (Get-Location) 'dist'))) {
            Copy-Item (Join-Path $src 'opengl32.dll') $target -Force
            $gallium = Join-Path $src 'libgallium_wgl.dll'
            if (!(Test-Path $gallium)) { throw 'Mesa libgallium_wgl.dll missing' }
            Copy-Item $gallium $target -Force
          }
          Set-Content -Path (Join-Path $env:LOVE_RUNTIME 'lovec.exe.local') -Value '' -NoNewline
          Set-Content -Path (Join-Path (Get-Location) 'dist/Android1412Rebuild.exe.local') -Value '' -NoNewline

      - name: Test both official LÖVE startup routes
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python tools/test.py --suite ui --runtime "$env:LOVE_RUNTIME"

      - name: Capture authentic Windows UI screenshots
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python tools/capture_showcase.py --runtime "$env:LOVE_RUNTIME" --output build/showcase

      - name: Publish actual UI screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: IbisRebuild-Real-Windows-Screenshots
          path: |
            build/showcase/*.png
            build/showcase/showcase-report.json
            build/showcase/verification.json
          if-no-files-found: error
          retention-days: 7

      - name: Package source-only Windows smoke-test build after passing all tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Mesa was loaded only to permit real window creation on this GPU-less
          # CI runner; never ship that alternate renderer in our app artifact.
          foreach ($file in @('opengl32.dll', 'libgallium_wgl.dll',
                              'Android1412Rebuild.exe.local')) {
            Remove-Item (Join-Path 'dist' $file) -ErrorAction SilentlyContinue
          }
          $manifest = Get-Content 'dist/build-manifest.json' -Raw | ConvertFrom-Json
          if (!$manifest.native_included -or !$manifest.offline -or $manifest.webview) {
            throw 'Refusing artifact: native/offline/no-WebView manifest invalid'
          }
          $allowed = @(
            'Android1412Rebuild.exe', 'rebuild_core.dll', 'LOVE-LICENSE.txt',
            'README.md', 'build-manifest.json', 'OpenAL32.dll', 'SDL2.dll',
            'love.dll', 'lua51.dll', 'mpg123.dll', 'msvcp120.dll',
            'msvcr120.dll'
          )
          $files = @(Get-ChildItem 'dist' -File | ForEach-Object { $_.Name })
          $unexpected = @($files | Where-Object { $allowed -cnotcontains $_ })
          if ($unexpected.Count -gt 0) { throw "Unexpected distributable files: $unexpected" }
          foreach ($required in @('Android1412Rebuild.exe','rebuild_core.dll',
                                  'lua51.dll','love.dll','LOVE-LICENSE.txt')) {
            if ($files -cnotcontains $required) { throw "Distributable missing $required" }
          }
          $destination = Join-Path $env:RUNNER_TEMP 'Android1412Rebuild-win64-tested.zip'
          Compress-Archive -Path 'dist/*' -DestinationPath $destination -Force
          "VERIFIED_ZIP=$destination" >> $env:GITHUB_ENV

      - name: Offer tested Windows build as CI artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: Android1412Rebuild-win64-tested
          path: ${{ env.VERIFIED_ZIP }}
          if-no-files-found: error
          retention-days: 7

      - name: Retain diagnostic reports (never publish unverified app)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          path: |
            build/preflight.json
            build/latest-test.json
            build/toolchain-report.json
            build/commands/**/process.json
            build/commands/**/stdout.log
            build/commands/**/stderr.log
            build/validation-*/**/process.json
            build/validation-*/**/stdout.log
            build/validation-*/**/stderr.log
            build/validation-*/**/report.json
          if-no-files-found: warn
          retention-days: 7
